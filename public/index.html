<!doctype html>

<html lang="zh">

<head>

<meta charset="utf-8">

<title>
ProxyIP Atlas
</title>


<link rel="stylesheet" href="style.css">


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/lipis/flag-icons/css/flag-icons.min.css">


</head>


<body>


<div class="container">


<header>

<h1>
🌐 ProxyIP Atlas
</h1>

<p>
proxyip.etoj.run.place A Record Explorer
</p>


<input
id="search"
placeholder="搜索国家 / 域名 / IP..."
>


</header>



<section id="stats">


<div>
国家
<strong id="countries">
-
</strong>
</div>


<div>
域名
<strong id="domains">
-
</strong>
</div>


<div>
IP
<strong id="ips">
-
</strong>
</div>


</section>



<main id="atlas">

加载中...

</main>



</div>



<script>


let data=[];



const flag=c=>
`
<span class="fi fi-${c.toLowerCase()}"></span>
`;



async function load(){


const res=
await fetch(
"/.netlify/functions/dns"
);


data=
await res.json();


render();


}



function render(){


const box=
document.querySelector("#atlas");


const keyword=
document.querySelector("#search").value
.toLowerCase();



let filtered=
data.filter(x=>
JSON.stringify(x)
.toLowerCase()
.includes(keyword)
);



countries=
new Set(
filtered.map(x=>x.country)
);



document.querySelector("#countries")
.textContent=
countries.size;


document.querySelector("#domains")
.textContent=
filtered.length;


document.querySelector("#ips")
.textContent=
filtered.reduce(
(a,b)=>a+b.ips.length,0
);



box.innerHTML="";



for(const item of filtered){


box.innerHTML+=`

<section class="card">


<h2>

${flag(item.country)}

${item.country}

</h2>


<div class="domain">

${item.domain}

<button onclick="copyText('${item.domain}')">
复制
</button>

</div>


<span class="tag">
${item.type}
</span>



<div class="ips">


${
item.ips.map(ip=>`

<div class="ip">

${ip}

<button onclick="copyText('${ip}')">
复制
</button>

</div>

`).join("")
}


</div>



</section>


`;

}


}



function copyText(t){

navigator.clipboard.writeText(t);

}



document
.querySelector("#search")
.oninput=
render;



load();


</script>


</body>

</html>
