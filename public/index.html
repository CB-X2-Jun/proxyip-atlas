<!doctype html>
<html lang="zh">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
ProxyIP Atlas
</title>


<link rel="stylesheet" href="style.css">


<link rel="stylesheet"
href="https://cdn.jsdelivr.net/gh/lipis/flag-icons/css/flag-icons.min.css">


</head>


<body>


<div class="container">


<header>

<h1>
🌐 ProxyIP Atlas
</h1>


<p>
proxyip.etoj.run.place A Record Explorer
</p>

<p>
为 <a href="https://github.com/6Kmfi6HP/EDtunnel" target="_blank">EDtunnel</a> 用户打造
</p>

<p>
具体说明与使用方式，请见页尾
</p>

<input
id="search"
placeholder="搜索国家 / 域名 / IP..."
>


</header>



<section id="stats">


<div>
国家
<strong id="countries">
-
</strong>
</div>


<div>
域名
<strong id="domains">
-
</strong>
</div>


<div>
IP
<strong id="ips">
-
</strong>
</div>


</section>



<main id="atlas">

加载中...

</main>


</div>



<script>


let data=[];



const TYPE_MAP={


"DC":
"数据中心",


"Residential":
"住宅家宽",


"Education":
"教育网络",


"Mobile":
"移动网络"


};



function copyText(text){


navigator.clipboard.writeText(text);


}



function groupData(list){


const result={};


for(const item of list){


if(!result[item.country]){

result[item.country]=[];

}


result[item.country].push(item);


}


return result;


}



function render(){


const keyword=
document
.querySelector("#search")
.value
.trim()
.toLowerCase();



const grouped={};



for(const item of data){


let matchedIPs=
item.ips.filter(ip=>

ip
.toLowerCase()
.includes(keyword)

);



let matched=false;



if(!keyword){

matched=true;

}
else{


matched =
item.country
.toLowerCase()
.includes(keyword)

||

item.domain
.toLowerCase()
.includes(keyword)

||

item.type
.toLowerCase()
.includes(keyword)

||

matchedIPs.length>0;


}



if(matched){


grouped[item.country] ??= [];


grouped[item.country]
.push({

...item,

displayIPs:

keyword && matchedIPs.length
?
matchedIPs
:
item.ips

});


}


}



const atlas=
document.querySelector("#atlas");


atlas.innerHTML="";



let domainCount=0;
let ipCount=0;



for(const country of Object.keys(grouped)){


const items=
grouped[country];



domainCount+=items.length;


for(const item of items){

ipCount+=item.displayIPs.length;

}



atlas.innerHTML+=`


<section class="card">


<h2>


<span class="fi fi-${country.toLowerCase()}">
</span>


${country}


</h2>



${


items.map(item=>`


<div class="entry">


<div class="domain">


<span>
${item.domain}
</span>


<button onclick="copyText('${item.domain}')">
复制
</button>


</div>



<div class="tag">

${TYPE_MAP[item.type] || item.type}

</div>



<div class="ips">


${

item.displayIPs.map(ip=>`

<div class="ip">


<span>
${ip}
</span>


<button onclick="copyText('${ip}')">
复制
</button>


</div>


`).join("")

}


</div>



</div>



`).join("")


}


</section>



`;


}




document
.querySelector("#countries")
.textContent=
Object.keys(grouped).length;



document
.querySelector("#domains")
.textContent=
domainCount;



document
.querySelector("#ips")
.textContent=
ipCount;



}



async function load(){


const res=
await fetch(
"/.netlify/functions/dns"
);



data=
await res.json();



render();


}



document
.querySelector("#search")
.addEventListener(
"input",
render
);



load();


</script>


</body>

</html>
